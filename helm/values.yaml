# Single replica only: data lives in JSON files on one ReadWriteOnce volume
replicaCount: 1

image:
  repository: ghcr.io/gkalian/amuzing-subs-calendar
  # Defaults to the chart appVersion when empty
  tag: ''
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

podSecurityContext:
  enabled: true
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: true
  ingressClassName: ''
  annotations: {}
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: example-tls
      hosts:
        - example.com

persistence:
  enabled: true
  # pvc | hostPath
  type: pvc
  size: 1Gi
  storageClass: ''
  accessModes:
    - ReadWriteOnce
  mountPath: /data
  hostPath:
    path: /srv/amuzing-subs-calendar/data
    type: DirectoryOrCreate

env:
  PORT: '8080'
  LOG_LEVEL: 'info'
